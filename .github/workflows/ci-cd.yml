name : Front CI Pipeline
on:
  push:
    branches: ["main","dev"]
  pull_request:
    branches: ["main","dev"]

  job:
    build-and-test:
      runs-on: ubuntu-latest

      steps:
        - name: Descargar repositorio
          uses: actions/checkout@v4

        - name: Configurar Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 20
            cache: 'npm'

        - name: Instalar dependencias
          run: npm ci

        - name: Validar Linting
          run: npm run lint

        - name: Compilador Proyecto(build)
          run: npm run build